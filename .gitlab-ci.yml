image: saisk026/ubuntu-docker:20.04

stages:
  - build
  - deploy

build_backend_dev:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  environment:
    name: development
  tags:
    - akeso-sk
  script:
   - echo "Building backend docker image"
   - export IMAGE_TAG="$(date +%Y%m%d%H%M)"
   - echo "IMAGE_TAG=${IMAGE_TAG}" > .env
   - mkdir -p /kaniko/.docker
   - echo "{\"auths\":{\"${ACR_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${ACR_USERNAME}" "${ACR_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
   - echo "Pushing the backend image to ACR with tag ${IMAGE_TAG}"
   - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${ACR_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_DEV_NAME}:${IMAGE_TAG}"
   - echo "Retagging the backend image to 2025 and pushing to ACR"
   - docker tag "${ACR_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_DEV_NAME}:${IMAGE_TAG}" "${ACR_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_DEV_NAME}:2025"
   - docker push "${ACR_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_DEV_NAME}:2025"

  artifacts:
    paths:
      - .env  # Upload .env file as artifact to be used in deploy stage

  rules:
    - if: $CI_COMMIT_BRANCH == "dev"





deploy_backend_dev:
  stage: deploy
  image: saisk026/kubectl:v2
  environment:
    name: development
  tags:
    - akeso-sk
  before_script:
    - echo "Deploying the backend application to Kubernetes"
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG" | base64 -d > ~/.kube/config
    - cat ~/.kube/config
    - kubectl get pods -A
  script:
    - echo "Loading the IMAGE_TAG from .env"
    - source .env  # Load IMAGE_TAG from the artifact

    # Verify if the deployment exists
    - echo "Checking if the backend deployment exists..."
    - DEPLOYMENT_EXISTS=$(kubectl get deployment backend-app --ignore-not-found)

    # If the deployment exists, update the image; if not, apply the manifest
    - |
      if [ -n "$DEPLOYMENT_EXISTS" ]; then
        echo "Backend deployment exists. Updating image to ${IMAGE_TAG}..."
        kubectl set image deployment/backend-app backend=${ACR_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_DEV_NAME}:${IMAGE_TAG} --record
      else
        echo "Backend deployment does not exist. Applying manifest.yaml..."
        kubectl apply -f ./manifest.yaml
      fi
  artifacts:
    paths:
      - .env  # Make sure .env is available as an artifact in this job
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

