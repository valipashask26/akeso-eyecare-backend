image: saisk026/ubuntu-docker:20.04

stages:
  - build
  - deploy

build_backend_dev:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  environment:
    name: development
  tags:
    - akeso-sk
  script:
    - echo "Building backend docker image"
    - export IMAGE_TAG="$(date +%Y%m%d%H%M)"
    - echo "IMAGE_TAG=${IMAGE_TAG}" > .env
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${ACR_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${ACR_USERNAME}" "${ACR_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - echo "Pushing the backend image to ACR with tag ${IMAGE_TAG}"
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${ACR_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_DEV_NAME}:${IMAGE_TAG}"
  artifacts:
    paths:
      - .env  # Upload .env file as artifact to be used in deploy stage
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"


deploy_backend_dev:
  stage: deploy
  image: saisk026/kubectl:v2
  environment:
    name: development
  tags:
    - akeso-sk
  before_script:
    - echo "Deploying the backend application to Kubernetes"
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG" | base64 -d > ~/.kube/config
    - cat ~/.kube/config
    - kubectl get pods -A
  script:
    - echo "Loading the IMAGE_TAG from .env"
    - cat .env  # Debugging step to print contents of .env file
    - source .env  # Load the IMAGE_TAG from .env
    - echo "Deploying backend with image tag ${IMAGE_TAG}"
    - envsubst < ./manifest.yaml | kubectl apply -f -  # Use envsubst to replace variables in manifest.yaml
  artifacts:
    paths:
      - .env  # Make sure .env is available as an artifact in this job
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

