apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ui-dev
data:
  ATLAS_URI: "mongodb://mongodb-ui-dev:27017/employees"
  PORT: "5050"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  namespace: ui-dev
  labels:
    app: backend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: backend-app-container
        image: "${ACR_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_DEV_NAME}:${IMAGE_TAG}"  # Dynamic image tag
        ports:
        - containerPort: 5050
        envFrom:
        - configMapRef:
            name: backend-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /record
            port: 5050
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /record
            port: 5050
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-service
  namespace: ui-dev
spec:
  selector:
    app: backend-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5050
  type: NodePort
